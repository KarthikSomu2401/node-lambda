name: Deploy to AWS Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python for SAM
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install SAM CLI
      run: pip install aws-sam-cli

    - name: Install Node dependencies
      run: npm ci

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Build SAM application
      run: sam build

    - name: Deploy SAM application
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        sam deploy \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --resolve-s3 \
          --stack-name notes-api-stack \
          --s3-prefix notes-api \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --region ${{ secrets.AWS_REGION }} \
          --parameter-overrides \
            MongoDBUri="$MONGODB_URI"

    - name: Get deployment outputs
      id: deployment
      run: |
        API_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name notes-api-stack \
          --query 'Stacks[0].Outputs[?OutputKey==`NotesApiEndpoint`].OutputValue' \
          --output text \
          --region ${{ secrets.AWS_REGION }})
        echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
        echo "✓ Deployment successful!"
        echo "API Endpoint: $API_ENDPOINT"
        echo "Health check: $API_ENDPOINT/health"

    - name: Publish deployment summary
      run: |
        echo "### Deployment successful" >> "$GITHUB_STEP_SUMMARY"
        echo "API endpoint: ${{ steps.deployment.outputs.api_endpoint }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Health check: ${{ steps.deployment.outputs.api_endpoint }}/health" >> "$GITHUB_STEP_SUMMARY"

