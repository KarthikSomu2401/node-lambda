name: Deploy to AWS Lambda

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python for SAM
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install SAM CLI
      run: pip install aws-sam-cli

    - name: Install Node dependencies
      run: npm ci

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::192929863481:role/github-actions-lambda-deploy
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Build SAM application
      run: sam build

    - name: Deploy SAM application
      run: |
        sam deploy \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --stack-name notes-api-stack \
          --s3-prefix notes-api \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
          --region ${{ secrets.AWS_REGION }} \
          --parameter-overrides \
            MongoDBUri=${{ secrets.MONGODB_URI }}

    - name: Get deployment outputs
      id: deployment
      run: |
        API_ENDPOINT=$(aws cloudformation describe-stacks \
          --stack-name notes-api-stack \
          --query 'Stacks[0].Outputs[?OutputKey==`NotesApiEndpoint`].OutputValue' \
          --output text \
          --region ${{ secrets.AWS_REGION }})
        echo "api_endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT
        echo "✓ Deployment successful!"
        echo "API Endpoint: $API_ENDPOINT"

    - name: Post deployment comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Lambda deployment successful!\n\nAPI Endpoint: `${{ steps.deployment.outputs.api_endpoint }}`'
          })

